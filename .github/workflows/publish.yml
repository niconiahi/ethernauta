name: publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pnpm version from .tool-versions
        id: tool_versions
        run: |
          pnpm_version=$(grep '^pnpm ' .tool-versions | awk '{print $2}')
          echo "pnpm=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool_versions.outputs.pnpm }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: No-escape-hatches ratchet
        run: pnpm lint:ratchet

  publish:
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pnpm version from .tool-versions
        id: tool_versions
        run: |
          pnpm_version=$(grep '^pnpm ' .tool-versions | awk '{print $2}')
          echo "pnpm=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool_versions.outputs.pnpm }}
          run_install: false

      - name: Install Node (configured for npm registry)
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run publish
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure Node for GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: https://npm.pkg.github.com
          scope: "@ethernauta"

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run publish:gh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
